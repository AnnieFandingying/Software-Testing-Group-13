{{- if .Values.discountService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.discountService.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.discountService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.discountService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.discountService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.discountService.name }}
    spec:
      serviceAccountName: {{ .Values.discountService.name }}
      containers:
      - name: server
        image: {{ .Values.images.repository }}/{{ .Values.discountService.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 50051
        readinessProbe:
          grpc:
            port: 50051
        livenessProbe:
          grpc:
            port: 50051
        env:
        - name: PORT
          value: "50051"
        - name: TELEMETRY_SERVICE_URL
          value: "http://{{ .Values.telemetryService.name }}:8080/events"
        resources:
          {{- toYaml .Values.discountService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.discountService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.discountService.name }}
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
{{- end }}
