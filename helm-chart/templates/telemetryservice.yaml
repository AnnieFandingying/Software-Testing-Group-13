{{- if .Values.telemetryService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.telemetryService.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.telemetryService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.telemetryService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.telemetryService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.telemetryService.name }}
    spec:
      serviceAccountName: {{ .Values.telemetryService.name }}
      containers:
      - name: server
        image: {{ .Values.images.repository }}/{{ .Values.telemetryService.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          {{- toYaml .Values.telemetryService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.telemetryService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.telemetryService.name }}
  ports:
  - name: http
    port: 8080
    targetPort: 8080
{{- end }}
