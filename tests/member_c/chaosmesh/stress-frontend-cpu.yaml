apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: member-c-frontend-cpu-pressure
  namespace: default
  labels:
    role: member-c
    scenario: frontend-cpu
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: frontend
  stressors:
    cpu:
      workers: 2
      load: 85
  duration: "5m"
