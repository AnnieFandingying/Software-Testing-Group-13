apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: checkout-telemetry-loss-weak-dependency
  namespace: default
  labels:
    test-suite: checkout-chaos
    scenario: telemetry-weak-dependency
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: telemetryservice
  direction: both
  loss:
    loss: "80"
    correlation: "25"
  duration: "5m"
