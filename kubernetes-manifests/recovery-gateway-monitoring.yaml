apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: recovery-gateway
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: recovery-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: recovery-gateway-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: recovery-gateway.rules
      rules:
        - alert: RecoveryGatewayCommandFailures
          expr: increase(recovery_gateway_commands_total{result!="ok"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
            service: recovery-gateway
          annotations:
            summary: "Recovery gateway command failure"
            description: "The recovery gateway rejected or failed at least one Agent command in the last 5 minutes."
